name: Update CV portrait
on:
  push:
    paths:
      - "myphoto.jpg"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  portrait:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --quiet pymupdf pillow
      - name: Insert new portrait into existing CV PDF
        run: |
          python scripts/update_cv_photo.py Mahdi_Mohammadigohari_CV.pdf myphoto.jpg /tmp/cv_with_portrait.pdf
          mv /tmp/cv_with_portrait.pdf Mahdi_Mohammadigohari_CV.pdf
      - name: Commit revised CV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Mahdi_Mohammadigohari_CV.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Add new professional portrait to academic CV"
            git push
          fi
